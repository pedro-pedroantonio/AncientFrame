<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact AncientFrame</title><meta name="description" content="Contact AncientFrame with questions, calculation issues, complaints, feedback or improvement ideas."><link rel="canonical" href="https://www.ancientframe.com/contact.html"><link rel="stylesheet" href="css/main.css"></head><body><header class="site-header"></header><main><section class="page-hero"><p class="eyebrow">Talk to us</p><h1>Something we should know?</h1><p>Report a problem, make a complaint, suggest an improvement, or tell us what would make AncientFrame more useful.</p></section><section class="section contact-section"><form id="feedbackForm" class="contact-form" novalidate><div class="input-grid"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label></div><label>What is this about?<select name="type"><option>Calculation issue</option><option>Complaint</option><option>Improvement idea</option><option>Feature request</option><option>General question</option></select></label><label>Message<textarea name="message" rows="8" minlength="10" required></textarea></label><input class="honeypot" name="website" tabindex="-1" autocomplete="off"><div id="feedbackStatus" role="status"></div><button class="button" type="submit">Send feedback →</button><p class="micro-note">Your message is prepared for the site's configured form endpoint. No email credentials are stored in this page.</p></form></section></main><footer class="site-footer"></footer><script src="js/main.js"></script></body></html>
